<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta
      name="description"
      content="SCIM College, Patna — BBA & BCA Academic Portal"
    />
    <title>Password Recovery | SCIM College</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/custom.css" />
    <script src="./js/env.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/common.js"></script>
  </head>
  <body>
    <div class="login-page">
      <div class="login-card card-scim">
        <div class="d-flex justify-content-between mb-4">
          <a href="./login.html">← Back to login</a>
          <button class="theme-toggle" data-theme-toggle></button>
        </div>

        <div class="section-kicker">Account recovery</div>
        <h1 class="h2 fw-bold">Reset your password</h1>
        <p class="text-secondary">
          A 7-digit OTP is sent to your registered email.
        </p>

        <form id="forgotForm">
          <label class="form-label">Registered email</label>
          <input name="email" type="email" class="form-control mb-3" required />
          <select name="role" class="form-select">
            <option value="student">Student</option>
            <option value="admin">Admin / Co-member</option>
          </select>
          <button class="btn btn-scim w-100 mt-4">Send OTP</button>
        </form>

        <hr class="my-4" />

        <form id="resetForm">
          <label class="form-label">7-digit OTP</label>
          <input name="otp" maxlength="7" class="form-control mb-3" required />
          <label class="form-label">New password</label>
          <input
            name="newPassword"
            type="password"
            minlength="8"
            class="form-control mb-3"
            required
          />
          <button class="btn btn-outline-dark w-100">Update password</button>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/auth.js"></script>
  </body>
</html>
