<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta
      name="description"
      content="SCIM College, Patna — BBA & BCA Academic Portal"
    />
    <title>Login | SCIM College</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/custom.css" />
    <script src="./js/env.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/common.js"></script>
  </head>
  <body>
    <div class="login-page">
      <div class="login-card card-scim">
        <div class="d-flex align-items-center justify-content-between mb-4">
          <a href="./index.html" class="text-decoration-none">
            <span class="brand-mark">SC</span> <b>SCIM COLLEGE</b>
          </a>
          <button class="theme-toggle" data-theme-toggle></button>
        </div>

        <div id="loginPanel">
          <div class="section-kicker">Secure access</div>
          <h1 class="h2 fw-bold">Welcome back</h1>
          <p class="text-secondary">
            Sign in with your institutional credentials.
          </p>
          <form id="loginForm">
            <label class="form-label">Email</label>
            <input
              name="email"
              type="email"
              class="form-control mb-3"
              required
            />
            <label class="form-label">Password</label>
            <input
              name="password"
              type="password"
              class="form-control mb-3"
              required
            />
            <div class="d-flex justify-content-between mb-4">
              <select name="role" class="form-select w-auto">
                <option value="student">Student</option>
                <option value="admin">Admin / Co-member</option>
              </select>
              <a href="./forgot-password.html"
                >Forgot password?</a
              >
            </div>
            <button class="btn btn-scim w-100">Sign in</button>
          </form>
        </div>

        <div id="otpPanel" class="d-none">
          <div class="section-kicker">Additional verification</div>
          <h2 class="h3 fw-bold">Enter your 7-digit OTP</h2>
          <p class="text-secondary">Check your registered email.</p>
          <form id="otpForm">
            <input
              name="otp"
              class="form-control form-control-lg text-center"
              minlength="7"
              maxlength="7"
              required
            />
            <button class="btn btn-scim w-100 mt-3">
              Verify &amp; continue
            </button>
          </form>
        </div>

        <p class="text-center small mt-4">
          <a href="./index.html">← Back to college</a>
        </p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/auth.js"></script>
  </body>
</html>
